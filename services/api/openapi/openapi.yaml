                "type": "null"
              }
            ]
          }
        },
        "type": "object",
        "required": [
          "conversation_id",
          "message"
        ],
        "title": "ChatIn"
      },
      "DayEvent": {
        "properties": {
          "title": {
            "type": "string",
            "title": "Title"
          },
          "place": {
            "type": "string",
            "title": "Place"
          },
          "start": {
            "type": "string",
            "format": "date-time",
            "title": "Start"
          },
          "end": {
            "anyOf": [
              {
                "type": "string",
                "format": "date-time"
              },
              {
                "type": "null"
              }
            ],
            "title": "End"
          }
        },
        "type": "object",
        "required": [
          "title",
          "place",
          "start"
        ],
        "title": "DayEvent"
      },
      "DayRequest": {
        "properties": {
          "events": {
            "items": {
              "$ref": "#/components/schemas/DayEvent"
            },
            "type": "array",
            "title": "Events"
          },
          "start_place": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Start Place"
          }
        },
        "type": "object",
        "required": [
          "events"
        ],
        "title": "DayRequest"
      },
      "HTTPValidationError": {
        "properties": {
          "detail": {
            "items": {
              "$ref": "#/components/schemas/ValidationError"
            },
            "type": "array",
            "title": "Detail"
          }
        },
        "type": "object",
        "title": "HTTPValidationError"
      },
      "Leg": {
        "properties": {
          "kind": {
            "$ref": "#/components/schemas/LegKind"
          },
          "duration_s_p50": {
            "type": "number",
            "minimum": 0.0,
            "title": "Duration S P50",
            "description": "Median leg duration (s)"
          },
          "label": {
            "type": "string",
            "title": "Label"
          },
          "route_id": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Route Id"
          },
          "from_stop_id": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "From Stop Id"
          },
          "to_stop_id": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "To Stop Id"
          },
          "geometry_ref": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Geometry Ref",
            "description": "Id of polyline/geometry asset; not inline OSM"
          },
          "path": {
            "items": {
              "items": {
                "type": "number"
              },
              "type": "array"
            },
            "type": "array",
            "title": "Path",
            "description": "[[lat,lon],...]"
          },
          "distance_m": {
            "anyOf": [
              {
                "type": "number"
              },
              {
                "type": "null"
              }
            ],
            "title": "Distance M"
          },
          "estimate": {
            "type": "boolean",
            "title": "Estimate",
            "default": false
          },
          "synthetic": {
            "type": "boolean",
            "title": "Synthetic",
            "default": false
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "kind",
          "duration_s_p50",
          "label"
        ],
        "title": "Leg",
        "description": "One PRT segment: walk \u2192 wait \u2192 ride \u2192 (transfer) \u2192 walk."
      },
      "LegKind": {
        "type": "string",
        "enum": [
          "walk",
          "wait",
          "ride",
          "transfer_walk"
        ],
        "title": "LegKind"
      },
      "Origin": {
        "properties": {
          "lat": {
            "type": "number",
            "title": "Lat"
          },
          "lon": {
            "type": "number",
            "title": "Lon"
          }
        },
        "type": "object",
        "required": [
          "lat",
          "lon"
        ],
        "title": "Origin"
      },
      "PlaceRef": {
        "properties": {
          "lat": {
            "type": "number",
            "maximum": 90.0,
            "minimum": -90.0,
            "title": "Lat"
          },
          "lon": {
            "type": "number",
            "maximum": 180.0,
            "minimum": -180.0,
            "title": "Lon"
          },
          "place_id": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Place Id"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "lat",
          "lon"
        ],
        "title": "PlaceRef",
        "description": "Origin or destination coordinate, optionally tied to a known place."
      },
      "PlanConstraints": {
        "properties": {
          "origin": {
            "$ref": "#/components/schemas/PlaceRef"
          },
          "destination": {
            "$ref": "#/components/schemas/PlaceRef"
          },
          "arrive_by": {
            "anyOf": [
              {
                "type": "string",
                "format": "date-time"
              },
              {
                "type": "null"
              }
            ],
            "title": "Arrive By",
            "description": "ISO-8601 arrive-by deadline"
          },
          "depart_at": {
            "anyOf": [
              {
                "type": "string",
                "format": "date-time"
              },
              {
                "type": "null"
              }
            ],
            "title": "Depart At",
            "description": "ISO-8601 depart-at time; omit for leave-now"
          },
          "prefs": {
            "$ref": "#/components/schemas/PlanPrefs"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "origin",
          "destination"
        ],
        "title": "PlanConstraints",
        "description": "Request constraints for POST /trips/plan."
      },
      "PlanPrefs": {
        "properties": {
          "avoid_stairs": {
            "type": "boolean",
            "title": "Avoid Stairs",
            "default": false
          },
          "walk_speed_mps": {
            "type": "number",
            "exclusiveMinimum": 0.0,
            "title": "Walk Speed Mps",
            "description": "Walking speed in m/s",
            "default": 1.4
          }
        },
        "additionalProperties": false,
        "type": "object",
        "title": "PlanPrefs",
        "description": "Traveler preferences applied by the deterministic planner."
      },
      "PlanRequest": {
        "properties": {
          "constraints": {
            "$ref": "#/components/schemas/PlanConstraints"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "constraints"
        ],
        "title": "PlanRequest",
        "description": "Body for POST /trips/plan."
      },
      "PlanResponse": {
        "properties": {
          "trace": {
            "$ref": "#/components/schemas/TripTrace"
          },
          "contract_version": {
            "type": "string",
            "title": "Contract Version",
            "default": "v0"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "trace"
        ],
        "title": "PlanResponse",
        "description": "Successful plan response \u2014 a TripTrace."
      },
      "Quantiles": {
        "properties": {
          "p10": {
            "type": "number",
            "title": "P10",
            "description": "10th percentile duration in seconds"
          },
          "p50": {
            "type": "number",
            "title": "P50",
            "description": "Median duration in seconds"
          },
          "p90": {
            "type": "number",
            "title": "P90",
            "description": "90th percentile duration in seconds"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "p10",
          "p50",
          "p90"
        ],
        "title": "Quantiles",
        "description": "Duration / ETA quantiles in seconds."
      },
      "SocialFactor": {
        "properties": {
          "source": {
            "type": "string",
            "title": "Source"
          },
          "badge_required": {
            "type": "boolean",
            "title": "Badge Required",
            "default": true
          },
          "spread_multiplier": {
            "type": "number",
            "exclusiveMinimum": 0.0,
            "title": "Spread Multiplier"
          },
          "label": {
            "type": "string",
            "title": "Label"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "source",
          "spread_multiplier",
          "label"
        ],
        "title": "SocialFactor",
        "description": "Secondary X/social uncertainty; must be badged when applied."
      },
      "TripPlan": {
        "properties": {
          "legs": {
            "items": {
              "$ref": "#/components/schemas/Leg"
            },
            "type": "array",
            "minItems": 1,
            "title": "Legs"
          },
          "total_s": {
            "$ref": "#/components/schemas/Quantiles"
          },
          "leave_at": {
            "type": "string",
            "format": "date-time",
            "title": "Leave At",
            "description": "ISO-8601 leave time"
          },
          "arrive_at": {
            "type": "string",
            "format": "date-time",
            "title": "Arrive At",
            "description": "ISO-8601 arrive time"
          },
          "p_on_time": {
            "type": "number",
            "maximum": 1.0,
            "minimum": 0.0,
            "title": "P On Time"
          },
          "p_catch": {
            "anyOf": [
              {
                "type": "number",
                "maximum": 1.0,
                "minimum": 0.0
              },
              {
                "type": "null"
              }
            ],
            "title": "P Catch",
            "description": "Probability of catching the bus"
          },
          "explanation_facts": {
            "items": {
              "type": "string"
            },
            "type": "array",
            "title": "Explanation Facts"
          },
          "mode": {
            "type": "string",
            "title": "Mode",
            "description": "walk_only | bus",
            "default": "walk_only"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "legs",
          "total_s",
          "leave_at",
          "arrive_at",
          "p_on_time"
        ],
        "title": "TripPlan",
        "description": "A single planned itinerary with confidence quantiles."
      },
      "TripTrace": {
        "properties": {
          "plan": {
            "$ref": "#/components/schemas/TripPlan"
          },
          "alternatives": {
            "items": {
              "$ref": "#/components/schemas/TripPlan"
            },
            "type": "array",
            "title": "Alternatives"
          },
          "allowed_numbers": {
            "items": {
              "anyOf": [
                {
                  "type": "number"
                },
                {
                  "type": "integer"
                }
              ]
            },
            "type": "array",
            "title": "Allowed Numbers"
          },
          "model_id": {
            "type": "string",
            "title": "Model Id"
          },
          "confidence_horizon_s": {
            "type": "number",
            "minimum": 0.0,
            "title": "Confidence Horizon S"
          },
          "social_factor": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/SocialFactor"
              },
              {
                "type": "null"
              }
            ]
          },
          "verification_version": {
            "type": "string",
            "title": "Verification Version",
            "default": "v0"
          },
          "status": {
            "type": "string",
            "title": "Status",
            "description": "ok | at_risk",
            "default": "ok"
          },
          "origin_name": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Origin Name"
          },
          "destination_name": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Destination Name"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "plan",
          "model_id",
          "confidence_horizon_s"
        ],
        "title": "TripTrace",
        "description": "Canonical planner output. Verification checks spoken/displayed numbers\nagainst allowed_numbers only."
      },
      "ValidationError": {
        "properties": {
          "loc": {
            "items": {
              "anyOf": [
                {
                  "type": "string"
                },
                {
                  "type": "integer"
                }
              ]
            },
            "type": "array",
            "title": "Location"
          },
          "msg": {
            "type": "string",
            "title": "Message"
          },
          "type": {
            "type": "string",
            "title": "Error Type"
          },
          "input": {
            "title": "Input"
          },
          "ctx": {
            "type": "object",
            "title": "Context"
          }
        },
        "type": "object",
        "required": [
          "loc",
          "msg",
          "type"
        ],
        "title": "ValidationError"
      }
    }
  }
}