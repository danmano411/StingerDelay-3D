    "schemas": {
      "Body_transcribe_grok_transcribe_post": {
        "properties": {
          "file": {
            "type": "string",
            "contentMediaType": "application/octet-stream",
            "title": "File"
          }
        },
        "type": "object",
        "required": [
          "file"
        ],
        "title": "Body_transcribe_grok_transcribe_post"
      },
      "ChatIn": {
        "properties": {
          "conversation_id": {
            "type": "string",
            "title": "Conversation Id"
          },
          "message": {
            "type": "string",
            "title": "Message"
          },
          "now": {
            "anyOf": [
              {
                "type": "string"
              },
