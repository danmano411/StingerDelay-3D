openapi: 3.0.3
info:
  title: StingerDelay-3D API
  description: |
    Shared planner API for web and iOS. Contract version **v0**.

    Rules:
    - Every displayed/spoken number must come from `TripTrace.allowed_numbers`.
    - Social/X factors only widen uncertainty and require a badge.
    - Payloads stay compact; geometry is referenced by id, not inline OSM.
  version: "0.0.0"
  x-contract-version: v0

servers:
  - url: http://127.0.0.1:8000
    description: Local FastAPI

tags:
  - name: health
  - name: trips
  - name: calendar
  - name: signals

paths:
  /health:
    get:
      tags: [health]
      summary: Liveness check
      operationId: getHealth
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /trips/plan:
    post:
      tags: [trips]
      summary: Plan a trip; returns a TripTrace
      operationId: postTripsPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanRequest"
            example:
              constraints:
                origin:
                  lat: 33.7771
                  lon: -84.3960
                  place_id: klaus
                destination:
                  lat: 33.7745
                  lon: -84.3987
                  place_id: kendeda
                arrive_by: "2026-11-03T08:30:00-05:00"
                prefs:
                  avoid_stairs: true
                  walk_speed_mps: 1.4
      responses:
        "200":
          description: Chosen plan + alternatives as TripTrace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanResponse"
        "422":
          description: Validation error (missing OD, bad prefs, etc.)

  /calendar/next:
    get:
      tags: [calendar]
      summary: Next calendar / class event (mock when no OAuth)
      operationId: getCalendarNext
      responses:
        "200":
          description: Next event or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarNextResponse"

  /signals/x:
    get:
      tags: [signals]
      summary: Secondary X / social uncertainty factor
      operationId: getSignalsX
      parameters:
        - name: place_id
          in: query
          required: false
          schema:
            type: string
        - name: lat
          in: query
          required: false
          schema:
            type: number
            format: double
        - name: lon
          in: query
          required: false
          schema:
            type: number
            format: double
      responses:
        "200":
          description: Optional SocialFactor (badge required when present)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalsXResponse"

components:
  schemas:
    Quantiles:
      type: object
      additionalProperties: false
      required: [p10, p50, p90]
      properties:
        p10:
          type: number
          minimum: 0
          description: 10th percentile seconds
        p50:
          type: number
          minimum: 0
          description: Median seconds
        p90:
          type: number
          minimum: 0
          description: 90th percentile seconds

    PlaceRef:
      type: object
      additionalProperties: false
      required: [lat, lon]
      properties:
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
        lon:
          type: number
          format: double
          minimum: -180
          maximum: 180
        place_id:
          type: string
          nullable: true

    PlanPrefs:
      type: object
      additionalProperties: false
      properties:
        avoid_stairs:
          type: boolean
          default: false
        walk_speed_mps:
          type: number
          exclusiveMinimum: 0
          default: 1.4

    PlanConstraints:
      type: object
      additionalProperties: false
      required: [origin, destination]
      properties:
        origin:
          $ref: "#/components/schemas/PlaceRef"
        destination:
          $ref: "#/components/schemas/PlaceRef"
        arrive_by:
          type: string
          format: date-time
          nullable: true
        depart_at:
          type: string
          format: date-time
          nullable: true
        prefs:
          $ref: "#/components/schemas/PlanPrefs"

    LegKind:
      type: string
      enum: [walk, wait, ride, transfer_walk]

    Leg:
      type: object
      additionalProperties: false
      required: [kind, duration_s_p50, label]
      properties:
        kind:
          $ref: "#/components/schemas/LegKind"
        duration_s_p50:
          type: number
          minimum: 0
        label:
          type: string
        route_id:
          type: string
          nullable: true
        from_stop_id:
          type: string
          nullable: true
        to_stop_id:
          type: string
          nullable: true
        geometry_ref:
          type: string
          nullable: true
          description: Id of polyline asset; not full OSM geometry

    TripPlan:
      type: object
      additionalProperties: false
      required: [legs, total_s, leave_at, arrive_at, p_on_time]
      properties:
        legs:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Leg"
        total_s:
          $ref: "#/components/schemas/Quantiles"
        leave_at:
          type: string
          format: date-time
        arrive_at:
          type: string
          format: date-time
        p_on_time:
          type: number
          minimum: 0
          maximum: 1
        p_catch:
          type: number
          minimum: 0
          maximum: 1
          nullable: true
        explanation_facts:
          type: array
          items:
            type: string

    SocialFactor:
      type: object
      additionalProperties: false
      required: [source, badge_required, spread_multiplier, label]
      properties:
        source:
          type: string
        badge_required:
          type: boolean
        spread_multiplier:
          type: number
          exclusiveMinimum: 0
        label:
          type: string

    TripTrace:
      type: object
      additionalProperties: false
      required:
        - plan
        - allowed_numbers
        - model_id
        - confidence_horizon_s
        - verification_version
      properties:
        plan:
          $ref: "#/components/schemas/TripPlan"
        alternatives:
          type: array
          items:
            $ref: "#/components/schemas/TripPlan"
        allowed_numbers:
          type: array
          items:
            oneOf:
              - type: number
              - type: integer
          description: Only these numbers may be spoken/displayed
        model_id:
          type: string
          example: eta_decile_lookup_v0
        confidence_horizon_s:
          type: number
          minimum: 0
        social_factor:
          allOf:
            - $ref: "#/components/schemas/SocialFactor"
          nullable: true
        verification_version:
          type: string
          example: v0

    PlanRequest:
      type: object
      additionalProperties: false
      required: [constraints]
      properties:
        constraints:
          $ref: "#/components/schemas/PlanConstraints"

    PlanResponse:
      type: object
      additionalProperties: false
      required: [trace, contract_version]
      properties:
        trace:
          $ref: "#/components/schemas/TripTrace"
        contract_version:
          type: string
          example: v0

    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service, contract_version]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: stingerdelay-3d-api
        contract_version:
          type: string
          example: v0

    CalendarEvent:
      type: object
      additionalProperties: false
      required: [id, title, start, end, source]
      properties:
        id:
          type: string
        title:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        place_id:
          type: string
          nullable: true
        lat:
          type: number
          nullable: true
        lon:
          type: number
          nullable: true
        source:
          type: string
          enum: [mock, google]

    CalendarNextResponse:
      type: object
      additionalProperties: false
      required: [contract_version]
      properties:
        event:
          allOf:
            - $ref: "#/components/schemas/CalendarEvent"
          nullable: true
        contract_version:
          type: string
          example: v0

    SignalsXResponse:
      type: object
      additionalProperties: false
      required: [contract_version]
      properties:
        factor:
          allOf:
            - $ref: "#/components/schemas/SocialFactor"
          nullable: true
        contract_version:
          type: string
          example: v0
